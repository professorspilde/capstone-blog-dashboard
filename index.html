<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Management Capstone | Student Blog Dashboard</title>
<style>
:root {
  --ink:#202124; --muted:#6b7280; --paper:#fff; --wash:#f4f6f8;
  --line:#e3e7eb; --accent:#315c75; --soft:#eef4f7;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--wash);line-height:1.5}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:42px 20px 34px;text-align:center}
header h1{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:-.02em}
header p{max-width:760px;margin:10px auto 0;color:var(--muted);font-size:17px}
main{max-width:1200px;margin:0 auto;padding:28px 18px 56px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.student{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.035)}
.student-head{padding:18px 20px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.student-head h2{font-size:20px;margin:0}
.bloglink{font-size:13px;color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap}
.bloglink:hover{text-decoration:underline}
.posts{padding:4px 20px 10px}
.post{padding:15px 0;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:none}
.post h3{font-size:16px;line-height:1.3;margin:0 0 5px}
.post h3 a{color:var(--ink);text-decoration:none}
.post h3 a:hover{color:var(--accent)}
.meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.excerpt{font-size:14px;color:#454b52}
.loading,.empty,.error{padding:20px;color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 36px}
</style>
</head>
<body>
<header>
  <h1>Marketing Management Capstone</h1>
  <p>Student Blog Dashboard · The three latest posts from each student's blog, all in one place.</p>
</header>
<main>
  <section id="grid" class="grid"></section>
</main>
<footer>Each block updates directly from the student's public Blogger feed.</footer>

<script>
const STUDENTS = [
  {"name":"Andy Singh","blog":"https://singhanandbir.blogspot.com/"},
  {"name":"Caroline Kreisel","blog":"https://carolinekreisel.blogspot.com/"},
  {"name":"Christian Haltom","blog":"https://christianhaltomcapstone.blogspot.com/"},
  {"name":"Connor Ink","blog":"https://cojostar.blogspot.com/"},
  {"name":"Gillian King","blog":"https://gillianking1.blogspot.com/"},
  {"name":"Ian Murphy","blog":"https://himurphy.blogspot.com/"},
  {"name":"Madi Winfree","blog":"https://madiwinfree.blogspot.com/"},
  {"name":"Maya Da Silva Abreu","blog":"https://mayadasilvaabreu.blogspot.com/"},
  {"name":"Michael Elliott","blog":"https://michaelelliott1.blogspot.com/"},
  {"name":"Ruben Rueda","blog":"https://rubenjamesrueda.blogspot.com/"},
  {"name":"Sarah Cos","blog":"https://sarahccos.blogspot.com/"}
];

const strip = (s="") => {
  const d=document.createElement("div");
  d.innerHTML=s;
  return (d.textContent||d.innerText||"").replace(/\s+/g," ").trim();
};
const esc = (s="") => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmt = d => new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",year:"numeric"}).format(new Date(d));

const grid = document.getElementById("grid");

function makeCard(student, idx) {
  const card = document.createElement("article");
  card.className = "student";
  card.innerHTML = `
    <div class="student-head">
      <h2>${esc(student.name)}</h2>
      <a class="bloglink" href="${esc(student.blog)}" target="_blank" rel="noopener">Visit blog ↗</a>
    </div>
    <div id="posts-${idx}" class="posts"><div class="loading">Loading latest posts…</div></div>`;
  grid.appendChild(card);
}

function entryLink(entry) {
  const links = entry.link || [];
  const alt = links.find(l => l.rel === "alternate");
  return alt ? alt.href : "#";
}

function renderFeed(idx, data) {
  const box = document.getElementById("posts-" + idx);
  const entries = ((data || {}).feed || {}).entry || [];

  if (!entries.length) {
    box.innerHTML = '<div class="empty">No posts yet.</div>';
    return;
  }

  box.innerHTML = entries.slice(0,3).map(entry => {
    let title = strip((entry.title && entry.title.$t) || "");
    const html = (entry.content && entry.content.$t) ||
                 (entry.summary && entry.summary.$t) || "";
    const text = strip(html);
    if (!title) title = text ? text.slice(0,70) + (text.length>70 ? "…" : "") : "New post";
    const excerpt = text.length > 145 ? text.slice(0,142) + "…" : text;
    const pubDate = (entry.published && entry.published.$t) ||
                    (entry.updated && entry.updated.$t) || "";

    return `<div class="post">
      <h3><a href="${esc(entryLink(entry))}" target="_blank" rel="noopener">${esc(title)}</a></h3>
      <div class="meta">${pubDate ? esc(fmt(pubDate)) : ""}</div>
      ${excerpt ? `<div class="excerpt">${esc(excerpt)}</div>` : ""}
    </div>`;
  }).join("");
}

function loadBloggerFeed(student, idx) {
  const callbackName = "__bloggerFeed_" + idx + "_" + Date.now();
  const box = document.getElementById("posts-" + idx);

  window[callbackName] = function(data) {
    try {
      renderFeed(idx, data);
    } finally {
      delete window[callbackName];
      script.remove();
    }
  };

  const script = document.createElement("script");
  const base = student.blog.replace(/\/+$/, "");
  script.src =
    base + "/feeds/posts/default" +
    "?alt=json-in-script" +
    "&max-results=3" +
    "&orderby=published" +
    "&callback=" + encodeURIComponent(callbackName) +
    "&_=" + Date.now();

  script.async = true;
  script.onerror = function() {
    box.innerHTML = '<div class="error">This feed could not be loaded right now.</div>';
    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

STUDENTS.forEach(makeCard);
STUDENTS.forEach(loadBloggerFeed);
</script>
</body>
</html>
